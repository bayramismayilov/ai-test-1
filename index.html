<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess the Animal - Quiz Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>Guess the Animal</h1>
        <p class="subtitle">Spot the animal from the clue before time runs out.</p>
      </header>

      <section id="start-screen" class="card">
        <h2>Choose Difficulty</h2>
        <p class="subtitle">Each question has 10 seconds on the clock.</p>
        <div class="difficulty-buttons">
          <button class="difficulty-btn" data-difficulty="easy">Easy</button>
          <button class="difficulty-btn" data-difficulty="medium">Medium</button>
          <button class="difficulty-btn" data-difficulty="hard">Hard</button>
        </div>
      </section>

      <section id="quiz-screen" class="card hidden" aria-live="polite">
        <div class="quiz-topbar">
          <p id="progress">Question 1 / 10</p>
          <p id="score">Score: 0 / 10</p>
          <p id="timer">Time: 10</p>
        </div>

        <div class="clue-card" role="note" aria-label="Animal clue">
          <span id="clue-emoji" class="clue-emoji" aria-hidden="true">🐾</span>
          <p id="clue-text" class="clue-text"></p>
        </div>

        <div id="options" class="options-grid"></div>

        <p id="status-message" class="status-message" role="alert"></p>

        <div class="actions">
          <button id="show-answer-btn" type="button">Show me the answer!</button>
          <button id="next-btn" type="button">Next</button>
        </div>
      </section>

      <section id="result-screen" class="card hidden">
        <h2>Quiz Complete!</h2>
        <p id="final-score" class="final-score"></p>
        <button id="restart-btn" type="button">Restart</button>
      </section>

    </main>

    <script src="app.js"></script>
  </body>
</html>
