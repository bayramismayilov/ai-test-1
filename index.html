<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nilay App - Flag Quiz Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <h1>Nilay App</h1>
        <p class="subtitle">Flag Quiz Game</p>
      </header>

      <section id="start-screen" class="card">
        <h2>Choose Difficulty</h2>
        <div class="difficulty-buttons">
          <button class="difficulty-btn" data-difficulty="easy">Easy</button>
          <button class="difficulty-btn" data-difficulty="medium">Medium</button>
          <button class="difficulty-btn" data-difficulty="hard">Hard</button>
        </div>
      </section>

      <section id="quiz-screen" class="card hidden" aria-live="polite">
        <div class="quiz-topbar">
          <p id="progress">Question 1 / 20</p>
          <p id="score">Score: 0 / 20</p>
        </div>

        <div class="flag-wrap">
          <img id="flag-image" alt="Country flag" />
        </div>

        <div id="options" class="options-grid"></div>

        <p id="status-message" class="status-message" role="alert"></p>

        <div class="actions">
          <button id="show-answer-btn" type="button">Show me the answer!</button>
          <button id="next-btn" type="button">Next</button>
        </div>
      </section>

      <section id="result-screen" class="card hidden">
        <h2>Quiz Complete!</h2>
        <p id="final-score" class="final-score"></p>
        <button id="restart-btn" type="button">Restart</button>
      </section>

      <section class="card info-card">
        <h2>Local Flag Files</h2>
        <p>
          This app loads flag images from <code>assets/flags/</code> as
          <code>.png</code> files (example: <code>france.png</code>,
          <code>brazil.png</code>). If files are missing, a placeholder flag is
          shown.
        </p>
        <details>
          <summary>Expected filename → country mapping</summary>
          <ul id="flag-file-list" class="file-list"></ul>
        </details>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
